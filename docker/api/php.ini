; JIG-SPOTS PHP overrides (dev-oriented but safe defaults).
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 120
expose_php = Off

; OPcache — enabled; validate timestamps so code changes are picked up in dev.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; ---------------------------------------------------------------- hardening
; Session upload progress — OFF.
;
; This is the feature CVE-2026-109619 (PHP2Shell, Oct 2026) is reached through. PHP
; enables it by DEFAULT and it runs on upload handling even when the application
; never calls session_start(), so "we don't use sessions" is not protection. The
; exploit path was confirmed on PHP-FPM, which is what this image runs.
;
; The real fix is the patched interpreter — the base image is pinned to 8.3.36 for
; exactly that. This line is defence in depth: it closes the same door a second time,
; and it is also PHP's own interim advice for CVE-2026-115560, which is NOT fixed in
; 8.3.36 and has no patch yet.
;
; Nothing in this application reads upload progress (no ini_set, no
; session.serialize_handler change anywhere), so turning it off costs nothing.
session.upload_progress.enabled = 0
